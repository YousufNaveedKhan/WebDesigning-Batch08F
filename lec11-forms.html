<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
        <br><br>
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter your password" required>

        <br><br>
        <label for="courses">Courses</label>
        <select name="courses" id="courses" required>
            <option value="Web Designing">Web Designing</option>
            <option value="Web Development">Web Development</option>
            <option value="Graphic Designing">Graphic Designing</option>
        </select>
        <br><br>
        <label for="gender">Gender:</label>
        Male <input type="radio" name="gender" id="gender" required>
        Female <input type="radio" name="gender" id="gender" required>

        <br><br>

        <label for="joining">Joining date</label>
        <input type="date" name="joining" id="joining" required>

        <br><br>
        <label for="skills">Skills:</label>
        WORD <input type="checkbox" name="skills" id="skills">
        EXCEL <input type="checkbox" name="skills" id="skills">
        POWERPOINT <input type="checkbox" name="skills" id="skills">
        HTML <input type="checkbox" name="skills" id="skills">
        CSS <input type="checkbox" name="skills" id="skills">
        <br><br>
        <label for="bio">Bio</label>
        <textarea name="bio" id="bio" maxlength="50"></textarea>
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
