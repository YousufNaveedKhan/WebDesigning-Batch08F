<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            text-align: center;
            padding: 20px 40px;
            border-bottom: 4px dashed indigo;
            /* border-top: 4px dashed indigo; */
            margin-top: 10px;
        }
        
        .card img {
            width: 120px;
            height: 120px;
        }

        .card h2 {
            margin: 10px;
        }

        .card p {
            font-size: 18px;
        }

        .card button {
            margin-top: 10px;
            padding: 10px 40px;
            background-color: darkorange;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .card button:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/6596/6596121.png" alt="User Avatar">
        <h2>ABDULLAH</h2>
        <p>Senior Software Developer</p>
        <button>Hire Me</button>
    </div>
    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/6596/6596110.png" alt="User Avatar">
        <h2>Saad</h2>
        <p>Senior Graphic Designer</p>
        <button>Hire Me</button>
    </div>
    <!-- <img src="https://img.magnific.com/free-vector/user-blue-gradient_78370-4692.jpg?semt=ais_hybrid&w=740&q=80" alt="User Avatar"> -->
</body>
</html>
