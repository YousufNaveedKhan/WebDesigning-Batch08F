<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            min-height: 100vh;
        }
        h2 {
            /* Border Thickness / Width, Border Style, Border color */
            border: 2px solid red;
            padding: 38px;
            margin-top: 20px;
            text-align: center;
            background-color: teal;
            border-radius: 28px;
            cursor: pointer;
        }

        h2:hover {
            background-color: black;
            color: white;
        }

        p {
            border: 2px solid blue;
            padding: 20px;
        }

        button {
            padding: 8px 26px 8px 26px;
            background-color: darkorange;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: 0.5s ease;
        }

        button:hover {
            background-color: black;
        }
    </style>
</head>
<body>
    <h2>HEADING</h2>
    <p style="margin: 90px;">Lorem ipsum dolor sit amet consectetur adipisicing elit. Illum molestiae praesentium nisi ut dolorum ipsam! Mollitia error esse natus? Natus culpa quasi hic ab mollitia. Beatae officia recusandae qui in.</p>

    <button>See More</button>
</body>
</html>
