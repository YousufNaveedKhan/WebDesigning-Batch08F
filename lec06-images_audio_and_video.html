<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lec06 - Images and Backgrounds</title>
    <style>
        img {
            border-radius: 8px;
            margin: 20px;
            border: 3px solid teal;
            cursor: pointer;
            transition: 0.2s ease;
        }

        img:hover {
            transform: translateY(-8px);
        }
    </style>
</head>
<body>
    <!-- Self Closing Tag -->
     <!-- src: Source || alt: Alternate -->
    <!-- METHOD 1: LINK -->
     <img src="https://cdn.pixabay.com/photo/2017/07/24/19/57/tiger-2535888_640.jpg" alt="Tiger Image" height="250" width="350">

     <!-- Method 2: FILE -->
      <img src="images/myImage.jpg" alt="User avatar" height="250" width="350">

      <audio controls>
        <source src="audio/fatiha.mp3">
      </audio>

      <video controls height="250" width="250">
        <source src="video/sample_video.mp4">
      </video>
</body>
</html>
